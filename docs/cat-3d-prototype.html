// =====================================================================
// 9. 技能菜单：以后的截屏、AI 对话等能力都在这里注册
// =====================================================================
// 每个技能：{ id, icon, label, run, isChecked?, comingSoon? }，type: 'separator' 为分隔线
const CAT_SKILLS = [
  { id: 'drinkWater', icon: '💧', label: '我喝了一杯', run: () => recordDrink() },
  { id: 'petCat', icon: '🤚', label: '摸摸煤球', run: () => catBrain.pet() },
  { id: 'peekNow', icon: '👀', label: '去偷看一下', run: () => { if (!catBrain.tryStartPeek(true)) effects.say('附近没有好藏的地方…'); } },
  { type: 'separator' },
  { id: 'roamFree', icon: '🐾', label: '自由散步', isChecked: () => catBrain.roamMode === 'free', run: () => catBrain.setRoamMode('free') },
  { id: 'roamAnchored', icon: '📌', label: '待在这里别动', isChecked: () => catBrain.roamMode === 'anchored', run: () => catBrain.setRoamMode('anchored') },
  { id: 'roamEdge', icon: '⬇', label: '去屏幕边缘待着', isChecked: () => catBrain.roamMode === 'edge', run: () => catBrain.setRoamMode('edge') },
  { type: 'separator' },
  { id: 'screenshot', icon: '📷', label: '截屏', comingSoon: true },
  { id: 'aiChat', icon: '💬', label: 'AI 对话', comingSoon: true },
];

const skillMenu = document.getElementById('skillMenu');
function showSkillMenu(clientX, clientY) {
  skillMenu.innerHTML = '<div class="menu-title">🐾 煤球的技能</div>';
  for (const skill of CAT_SKILLS) {
    if (skill.type === 'separator') { skillMenu.appendChild(document.createElement('hr')); continue; }
    const item = document.createElement('div');
    item.className = 'menu-item' + (skill.comingSoon ? ' coming-soon' : '');
    const suffix = skill.comingSoon ? '<span class="badge">即将推出</span>' : (skill.isChecked?.() ? '<span class="check">✓</span>' : '');
    item.innerHTML = `<span>${skill.icon}</span><span>${skill.label}</span>${suffix}`;
    item.addEventListener('click', () => {
      hideSkillMenu();
      if (skill.comingSoon) effects.sayLine('coming-soon', { isImportant: true });
      else skill.run();
    });
    skillMenu.appendChild(item);
  }
  skillMenu.classList.add('visible');
  const menuRect = skillMenu.getBoundingClientRect();
  skillMenu.style.left = Math.min(clientX, innerWidth - menuRect.width - 8) + 'px';
  skillMenu.style.top = Math.min(clientY, innerHeight - menuRect.height - 8) + 'px';
}
function hideSkillMenu() { skillMenu.classList.remove('visible'); }

// =====================================================================
// 10. 鼠标交互（画布本身不接收事件，用射线检测判断是否点到猫）
// =====================================================================
const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();
let canvasLeft = 0, canvasTop = 0;
let lastPointerTime = performance.now();

function isPointerOnCat(clientX, clientY) {
  // 被藏身窗口挡住（裁掉）的部分不算点到猫
  const clipRect = catBrain.clipRect;
  if (clipRect && pointInRectangle(clientX, clientY, clipRect)) return false;
  const localX = clientX - canvasLeft, localY = clientY - canvasTop;
  if (localX < 0 || localY < 0 || localX > CAT_CANVAS_SIZE || localY > CAT_CANVAS_SIZE) return false;
  pointerNdc.set(localX / CAT_CANVAS_SIZE * 2 - 1, -(localY / CAT_CANVAS_SIZE * 2 - 1));
  raycaster.setFromCamera(pointerNdc, camera);
  return raycaster.intersectObject(catModel.root, true).length > 0;
}

let pressState = null;       // 按下猫时记录起点，用来区分单击 / 双击 / 拖动
let singleClickTimer = null;
let lastClickTime = 0;

window.addEventListener('pointermove', event => {
  const now = performance.now();
  const elapsed = Math.max(1, now - lastPointerTime) / 1000;
  const instantSpeed = Math.hypot(event.clientX - catBrain.cursor.x, event.clientY - catBrain.cursor.y) / elapsed;
  catBrain.cursor.speed = catBrain.cursor.x < -1000 ? 0 : damp(catBrain.cursor.speed, instantSpeed, 12, elapsed);
  catBrain.cursor.x = event.clientX;
  catBrain.cursor.y = event.clientY;
  lastPointerTime = now;

  if (pressState) {
    if (!pressState.isDragging && Math.hypot(event.clientX - pressState.startX, event.clientY - pressState.startY) > 6) {
      pressState.isDragging = true;
      catBrain.liftUp();
    }
    if (pressState.isDragging) {
      catBrain.position.x = event.clientX;
      catBrain.position.y = event.clientY + 105; // 拎着后颈，脚底在鼠标下方
    }
    return;
  }
  const isOnCat = isPointerOnCat(event.clientX, event.clientY);
  document.body.style.cursor = isOnCat ? 'grab' : '';
  if (isOnCat) catBrain.peekCaught(); // 偷看时被鼠标指到：抓包！
}, true);

// 捕获阶段拦截：点到猫时不让下面的窗口收到事件；点到透明区域则正常穿透
window.addEventListener('pointerdown', event => {
  if (skillMenu.classList.contains('visible') && !skillMenu.contains(event.target)) hideSkillMenu();
  if (event.button !== 0 || !isPointerOnCat(event.clientX, event.clientY)) return;
  event.stopPropagation();
  event.preventDefault();
  pressState = { startX: event.clientX, startY: event.clientY, isDragging: false };
  document.body.style.cursor = 'grabbing';
}, true);

window.addEventListener('pointerup', event => {
  if (!pressState) return;
  event.stopPropagation();
  const wasDragging = pressState.isDragging;
  pressState = null;
  document.body.style.cursor = '';
  if (wasDragging) {
    catBrain.dropAt(event.clientX, event.clientY + 105);
    return;
  }
  // 300 毫秒内第二次点击算双击：记一杯；否则算单击：摸摸
  const now = performance.now();
  if (now - lastClickTime < 300) {
    clearTimeout(singleClickTimer);
    lastClickTime = 0;
    recordDrink();
  } else {
    lastClickTime = now;
    singleClickTimer = setTimeout(() => catBrain.pet(), 300);
  }
}, true);

// 右键猫：技能菜单
window.addEventListener('contextmenu', event => {
  if (!isPointerOnCat(event.clientX, event.clientY)) return;
  event.preventDefault();
  event.stopPropagation();
  showSkillMenu(event.clientX, event.clientY);
}, true);

window.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  hideSkillMenu();
  const fullscreenWindow = desktop.windows.find(item => item.isFullscreen);
  if (fullscreenWindow) desktop.toggleFullscreen(fullscreenWindow);
});

// ---------- 饮水记录 ----------
let cupsToday = 0;
function recordDrink() {
  cupsToday++;
  catBrain.drinkRecorded();
  const reachedGoal = cupsToday === DAILY_GOAL_CUPS;
  // 达标说专门的台词；1~12 杯按杯数说；更多就说通用的夸奖
  if (reachedGoal) effects.sayLine('goal-reached', { durationMs: 3500, isImportant: true });
  else if (pickVoiceLine('drinkCount', cupsToday)) effects.sayLine('drinkCount', { count: cupsToday, isImportant: true });
  else effects.sayLine('drink-generic', { isImportant: true, fallbackText: `呼噜呼噜～今天第 ${cupsToday} 杯啦 💦` });
  document.getElementById('trayProgress').textContent = `🐾 ${cupsToday}/${DAILY_GOAL_CUPS}`;
}
document.getElementById('drankButton').addEventListener('click', recordDrink);
document.getElementById('snoozeButton').addEventListener('click', () => catBrain.snooze());

// ---------- 控制面板 ----------
document.getElementById('remindButton').addEventListener('click', () => catBrain.startRemind());
document.getElementById('peekButton').addEventListener('click', () => { if (!catBrain.tryStartPeek(true)) effects.say('附近没有好藏的地方…'); });
document.getElementById('sleepButton').addEventListener('click', () => catBrain.goToSleep());
document.getElementById('wakeButton').addEventListener('click', () => { if (catBrain.behavior === 'sleep') catBrain.pet(); });
let newWindowCount = 0;
document.getElementById('newWindowButton').addEventListener('click', () => {
  newWindowCount++;
  desktop.createWindow({
    title: `记事本 ${newWindowCount}`, appClass: 'app-note', contentHtml: '<div style="padding:12px;font-size:13px">随便写点什么…</div>',
    left: Math.round(randomBetween(100, innerWidth - 420)), top: Math.round(randomBetween(40, innerHeight - 380)), width: 320, height: 240,
  });
});
document.getElementById('maximizeAllButton').addEventListener('click', () => desktop.windows.forEach(item => desktop.toggleMaximize(item, true)));
document.getElementById('restoreAllButton').addEventListener('click', () => desktop.windows.forEach(item => {
  if (item.isFullscreen) desktop.toggleFullscreen(item);

document.getElementById('fullscreenButton').addEventListener('click', () => {

document.querySelectorAll('[data-wallpaper]').forEach(button => button.addEventListener('click', () => {
  document.getElementById('desktop').className = button.dataset.wallpaper;
}));
document.getElementById('voiceEnabledCheckbox').addEventListener('change', event => {

});
document.getElementById('voiceModeSelect').addEventListener('change', event => { catVoice.mode = event.target.value; });
document.getElementById('voiceTestButton').addEventListener('click', () => {
  effects.sayLine('remind', { isImportant: true, meowKind: 'call' });
});
const showFreeSpaceCheckbox = document.getElementById('showFreeSpaceCheckbox');
showFreeSpaceCheckbox.addEventListener('change', () => overlayNeedsRedraw = true);
window.addEventListener('resize', () => desktop.onLayoutChange());

// ---------- 空闲区域可视化 ----------
const overlayCanvas = document.getElementById('freeSpaceOverlay');
const overlayContext = overlayCanvas.getContext('2d');
function drawFreeSpaceOverlay() {
  if (overlayCanvas.width !== innerWidth || overlayCanvas.height !== innerHeight) {
    overlayCanvas.width = innerWidth;
    overlayCanvas.height = innerHeight;
  }
  overlayContext.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  if (!showFreeSpaceCheckbox.checked) return;
  overlayContext.fillStyle = 'rgba(80, 230, 140, .35)';
  for (let index = 0; index < freeSpaceMap.freeCells.length; index++) {
    if (!freeSpaceMap.freeCells[index]) continue;
    const center = freeSpaceMap.cellCenter(index);
    overlayContext.beginPath();
    overlayContext.arc(center.x, center.y, 2.5, 0, Math.PI * 2);
    overlayContext.fill();
  }
  if (catBrain.path.length) {
    overlayContext.strokeStyle = 'rgba(255, 220, 90, .9)';
    overlayContext.lineWidth = 2;
    overlayContext.setLineDash([6, 5]);
    overlayContext.beginPath();
    overlayContext.moveTo(catBrain.position.x, catBrain.position.y);
    catBrain.path.forEach(point => overlayContext.lineTo(point.x, point.y));
    overlayContext.stroke();
    overlayContext.setLineDash([]);
  }
  const geometry = catBrain.peekGeometry;
  if (geometry) {
    overlayContext.strokeStyle = 'rgba(255, 120, 200, .8)';
    overlayContext.strokeRect(geometry.headArea.left, geometry.headArea.top, geometry.headArea.right - geometry.headArea.left, geometry.headArea.bottom - geometry.headArea.top);
  }
}

// ---------- 主循环：逻辑每帧更新，渲染按帧率上限节流 ----------
let lastFrameTime = performance.now();
let lastRenderTime = 0;
let renderedFrameCount = 0, measuredFps = 0, fpsWindowStart = performance.now();
const statusText = document.getElementById('statusText');

function updateCanvasClip() {
  // 偷看时：把猫和藏身窗口重叠的部分裁成透明（用 evenodd 在画布上挖一个洞）
  const clipRect = catBrain.clipRect;
  if (!clipRect) { catCanvas.style.clipPath = ''; return; }
  const size = CAT_CANVAS_SIZE;
  const holeLeft = clamp(clipRect.left - canvasLeft, 0, size), holeRight = clamp(clipRect.right - canvasLeft, 0, size);
  const holeTop = clamp(clipRect.top - canvasTop, 0, size), holeBottom = clamp(clipRect.bottom - canvasTop, 0, size);
  catCanvas.style.clipPath = `polygon(evenodd, 0 0, ${size}px 0, ${size}px ${size}px, 0 ${size}px, 0 0, ` +
    `${holeLeft}px ${holeTop}px, ${holeRight}px ${holeTop}px, ${holeRight}px ${holeBottom}px, ${holeLeft}px ${holeBottom}px, ${holeLeft}px ${holeTop}px)`;
}

function mainLoop(now) {
  requestAnimationFrame(mainLoop);
  const deltaSeconds = Math.min(.05, (now - lastFrameTime) / 1000);
  lastFrameTime = now;
  catBrain.cursor.speed = damp(catBrain.cursor.speed, 0, 4, deltaSeconds); // 鼠标停下后速度逐渐归零
  catBrain.update(deltaSeconds);

  const frameInterval = 1000 / (catBrain.behavior === 'sleep' ? SLEEP_FPS : ACTIVE_FPS);
  if (now - lastRenderTime < frameInterval - 1) return;
  const renderDeltaSeconds = Math.min(.12, (now - lastRenderTime) / 1000);
  lastRenderTime = now;

  catModel.root.rotation.y = catBrain.yaw;
  catModel.update(catBrain.buildTargetPose(), catBrain.walkPhase, catBrain.elapsedSeconds, renderDeltaSeconds);
  renderer.render(scene, camera);

  // 画布跟着猫走（正式版里是 Rust 移动整个小窗口）
  canvasLeft = Math.round(catBrain.position.x - groundPointOnCanvas.x);
  canvasTop = Math.round(catBrain.position.y - groundPointOnCanvas.y);
  catCanvas.style.transform = `translate(${canvasLeft}px, ${canvasTop}px)`;
  updateCanvasClip();

  // 气泡跟在猫头顶
  const head = catBrain.headPosition;
  speechBubble.style.left = clamp(head.x - 115, 8, innerWidth - 240) + 'px';
  speechBubble.style.top = Math.max(8, head.y - 75 - speechBubble.offsetHeight) + 'px';

  if (showFreeSpaceCheckbox.checked || overlayNeedsRedraw) { drawFreeSpaceOverlay(); overlayNeedsRedraw = false; }

  renderedFrameCount++;
  if (now - fpsWindowStart > 1000) {
    measuredFps = Math.round(renderedFrameCount * 1000 / (now - fpsWindowStart));
    renderedFrameCount = 0;
    fpsWindowStart = now;
    const clock = new Date();
    document.getElementById('trayClock').textContent = `${String(clock.getHours()).padStart(2, '0')}:${String(clock.getMinutes()).padStart(2, '0')}`;
  }
  statusText.innerHTML = `状态：<b>${BEHAVIOR_LABELS[catBrain.behavior] ?? catBrain.behavior}</b><br>
    模式：${ROAM_MODE_LABELS[catBrain.roamMode]}${catBrain.isOnEdge ? '（在底边）' : ''}<br>
    今日 ${cupsToday}/${DAILY_GOAL_CUPS} 杯 · 空闲格子 ${freeSpaceMap.freeCellCount} · 渲染 ${measuredFps} fps`;
}

document.getElementById('loadingTip').remove();
requestAnimationFrame(mainLoop);

// 方便调试：在控制台里可以直接操作
window.catDebug = {
  catBrain, catModel, desktop, freeSpaceMap, peekPlanner, catVoice,
  // 直接把猫放到某个藏身处开始探头（调参用）
  forcePeek(spot) {
    const geometry = peekPlanner.geometryOf(spot);
    if (!geometry) return 'invalid';
    catBrain.peek = { spot, peekCount: 0, lastAnchor: { ...geometry.anchor } };
    Object.assign(catBrain.position, geometry.hiddenPoint);
    catBrain.yaw = catBrain.targetYaw = geometry.outYaw;
    catBrain.peekPopOut();
    return 'ok';
  },
};
